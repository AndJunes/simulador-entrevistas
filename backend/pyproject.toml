[project]
name = "simulador-entrevistas-backend"
version = "1.0.0"
description = "AI interview simulator API — questions from a real posting and your CV, voice interviews, anchored-rubric scoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "python-multipart",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "pgvector",
    "langgraph",
    "numpy",
    "openai",
    "httpx",
    "python-dotenv",
    "pyyaml",
    "nvidia-riva-client",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pytest-cov>=7.1.0",
]
# Local voice transcription (MLX needs Apple Silicon). Pins match the versions
# audited with OSV before adoption; on other platforms the group resolves empty
# and the backend runs in text mode.
stt = [
    "mlx==0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch==2.14.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface_hub; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends(...)/File(...)/Form(...) in parameter defaults is the FastAPI idiom

[tool.mypy]
files = ["app"]
check_untyped_defs = true
no_implicit_optional = true

[tool.coverage.report]
fail_under = 55

[tool.pytest.ini_options]
testpaths = ["tests"]
