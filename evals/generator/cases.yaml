# Dataset de regresión del GENERADOR de preguntas. 30 casos FICTICIOS: personas, empresas y
# CVs inventados para el test; ningún dato personal real.
#
# Cada caso:
#   must:       competencias que el banco TIENE que evaluar. Cubierta si alguna pregunta (texto en inglés +
#               competencia) contiene alguna de las palabras de `any` (minúsculas).
#   forbidden:  premisas que NINGUNA pregunta puede tener (regex sobre el texto en inglés): tecnologías o
#               experiencias que el CV no respalda.
#   checks:     expectativas extra: logistics_last (la logística va al final del screening), neutral_gap
#               (la brecha de años se pregunta sin tono acusatorio), ambiguity (el aviso es contradictorio).
#   tags:       para filtrar (--tag) y agrupar resultados.

- id: c01_backend_py_junior_partial
  tags: [backend, junior, partial_evidence, missing_tech]
  job: |
    # Backend Engineer (Python) — Northwind Labs
    Remote LATAM contractor role. You will build and maintain Python services for US clients.
    Must have: 2+ years of professional Python; REST APIs with FastAPI; asynchronous programming with asyncio;
    SQL and PostgreSQL; pytest; Git. Nice to have: Docker, AWS.
    Interview process: 20-minute recruiter screen, then a technical interview.
  cv: |
    # Lucía Ferro — Backend Developer
    Freelance backend developer (Feb 2026 – present): FastAPI services and PostgreSQL for two small clients.
    Project "QueueLab": a task queue in Python; found and fixed a race condition using threading locks; 60 pytest tests.
    QA analyst at RetailCo (2023–2025): manual testing and release coordination.
    Skills: Python, FastAPI, PostgreSQL, pytest, Git, Docker.
  must:
    - {name: async, any: [asyncio, async, concurren]}
    - {name: sql, any: [sql, postgres, query, index]}
    - {name: testing, any: [test, pytest]}
    - {name: git, any: [git, branch, pull request, commit]}
    - {name: api, any: [api, endpoint, fastapi]}
  forbidden: ["asyncio[^.?]*queuelab", "queuelab[^.?]*asyncio", "your aws"]
  checks: [logistics_last, neutral_gap]

